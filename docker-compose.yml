  kong:
    image: kong:3.9.3
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl
      KONG_SSL_CERT: /run/secrets/kong-server.crt
      KONG_SSL_CERT_KEY: /run/secrets/kong-server.key
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
    - ./gateway/kong/kong.yml:/kong/kong.yml:ro
    - ./platform/certs:/run/secrets:ro
    ports:
    - "${KONG_HTTPS_HOST_PORT:-8443}:8443"
    - "${KONG_ADMIN_HOST_PORT:-8001}:8001"
    depends_on:
      iam-service:
        condition: service_started
      credit-service:
        condition: service_started
      payment-service:
        condition: service_started
      report-service:
        condition: service_started
      audit-service:
        condition: service_started
      query-service:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - kong
      - health
      interval: 5s
      timeout: 5s
      retries: 30
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    ports:
    - "${FRONTEND_HOST_PORT:-4200}:80"
    depends_on:
      kong:
        condition: service_healthy
  redis-exporter:
    image: oliver006/redis_exporter:v1.86.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in secrets/bootstrap.env}
    depends_on:
      redis:
        condition: service_healthy
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.14.0
    volumes:
    - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./platform/certs:/run/secrets:ro
    - prometheus_data:/prometheus
    ports:
    - "${PROMETHEUS_HOST_PORT:-9090}:9090"
  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.2.2
    volumes:
    - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
    ports:
    - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in secrets/bootstrap.env}
  loki:
    restart: unless-stopped
    image: grafana/loki:3.7.8
    command:
    - -config.file=/etc/loki/config.yml
    volumes:
    - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
    - loki_data:/loki
    ports:
    - "${LOKI_HOST_PORT:-3100}:3100"
    user: 0:0
  tempo:
    restart: unless-stopped
    image: grafana/tempo:2.10.8
    command:
    - -config.file=/etc/tempo.yaml
    volumes:
    - ./observability/tempo.yml:/etc/tempo.yaml:ro
    - tempo_data:/var/tempo
    ports:
    - "${TEMPO_HOST_PORT:-3200}:3200"
    user: 0:0
  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.161.0
    command:
    - --config=/etc/otelcol/config.yml
    volumes:
    - ./observability/otel-collector/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
    - "${OTEL_GRPC_HOST_PORT:-4317}:4317"
    - "${OTEL_HTTP_HOST_PORT:-4318}:4318"
    - "${OTEL_HEALTH_HOST_PORT:-13133}:13133"
    depends_on:
      tempo:
        condition: service_started
  alloy:
    restart: unless-stopped
    image: grafana/alloy:v1.20.0
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - /etc/alloy/config.alloy
    volumes:
    - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
    - "${ALLOY_HOST_PORT:-12345}:12345"
    depends_on:
      loki:
        condition: service_started
    user: 0:0
volumes:
  postgres_data: null
  redis_data: null
  kafka_data: null
  minio_data: null
  prometheus_data: null
  loki_data: null
  tempo_data: null
  grafana_data: null
