# V3.6.6 - PostgreSQL TLS only for TCP clients.
# Local Unix-socket connections are needed by the official image during init.
local   all             all                                     trust

# All TCP clients must negotiate TLS and authenticate with SCRAM.
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256

# Explicitly reject plaintext TCP connections.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
